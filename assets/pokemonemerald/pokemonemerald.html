<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Pokémon Emerald</title>
<link rel="icon" href="data:,">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
#game {
  position: fixed;
  inset: 0;
}
#veil-emerald-error {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: min(480px, 86vw);
  padding: 16px 20px;
  border-radius: 10px;
  background: rgba(20, 20, 20, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #eee;
  font: 14px/1.45 system-ui, sans-serif;
  text-align: center;
  display: none;
  z-index: 10;
}
</style>
</head>
<body>
<div id="game"></div>
<div id="veil-emerald-error"></div>
<script>
(function () {
  function external(url) {
    try {
      var target = new URL(url instanceof Request ? url.url : String(url), location.href);
      return /^(https?|wss?):$/.test(target.protocol) && target.origin !== location.origin;
    } catch (error) {
      return false;
    }
  }
  var nativeFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    if (external(input)) return Promise.resolve(new Response("{}", { status: 200, headers: { "Content-Type": "application/json" } }));
    return nativeFetch(input, init);
  };
  var nativeOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    var args = Array.prototype.slice.call(arguments);
    if (external(url)) args[1] = "data:application/json,{}";
    return nativeOpen.apply(this, args);
  };
  var NativeSocket = window.WebSocket;
  window.WebSocket = function (url, protocols) {
    if (external(String(url).replace(/^ws/, "http"))) throw new Error("blocked");
    return protocols === undefined ? new NativeSocket(url) : new NativeSocket(url, protocols);
  };
  window.WebSocket.prototype = NativeSocket.prototype;
  if (navigator.sendBeacon) navigator.sendBeacon = function (url, data) { return external(url) ? true : Navigator.prototype.sendBeacon.call(navigator, url, data); };
  window.open = function () { return null; };
  window.alert = function (message) { if (window.veilEmeraldError) window.veilEmeraldError(message); };
})();
var errorBox = document.querySelector("#veil-emerald-error");
window.veilEmeraldError = function (message) {
  errorBox.textContent = "Pokémon Emerald couldn't start: " + String(message && message.message || message || "unknown error");
  errorBox.style.display = "block";
};
window.EJS_onLoadError = window.veilEmeraldError;
window.EJS_player = "#game";
window.EJS_core = "gba";
window.EJS_gameName = "Pokemon Emerald";
window.EJS_gameID = "pokemonemerald";
window.EJS_color = "#000000";
window.EJS_startOnLoaded = true;
window.EJS_pathtodata = "../emulators/emulatorjs/";
window.EJS_gameUrl = "assets/pokemonemerald.gba";
window.EJS_Buttons = { netplay: false };
function flushSave() {
  try {
    var emu = window.EJS_emulator;
    if (emu && emu.started && emu.gameManager) emu.gameManager.saveSaveFiles();
  } catch (error) {}
}
window.EJS_onGameStart = function () {
  setInterval(flushSave, 10000);
};
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushSave(); });
window.addEventListener("pagehide", flushSave);
window.addEventListener("blur", flushSave);
var script = document.createElement("script");
script.src = "../emulators/emulatorjs/loader.js";
script.onerror = function () { window.veilEmeraldError("the emulator loader is missing"); };
document.body.appendChild(script);
</script>
</body>
</html>
